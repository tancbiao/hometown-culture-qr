<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家乡文化二维码</title>
<style>
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:#FFF9F2;color:#33302C;
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;-webkit-text-size-adjust:100%;}
header{background:#fff;border-bottom:3px solid #FFE0C7;padding:14px 20px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
header h1{margin:0;font-size:24px;letter-spacing:.02em;}
header .sub{font-size:14px;color:#8A8078;}
header .spacer{flex:1;}
header a.wallbtn{font-size:15px;font-weight:700;color:#fff;text-decoration:none;
  background:#2A9D8F;border-radius:22px;padding:9px 20px;box-shadow:0 3px 0 #1F7D72;transition:.12s;}
header a.wallbtn:hover{background:#259184;}
header a.wallbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #1F7D72;}
header a.survbtn{font-size:15px;font-weight:700;color:#fff;text-decoration:none;
  background:#457B9D;border-radius:22px;padding:9px 20px;box-shadow:0 3px 0 #365F7A;transition:.12s;}
header a.survbtn:hover{background:#3F7091;}
header a.survbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #365F7A;}

main{padding:18px 20px 60px;max-width:1280px;margin:0 auto;}
.step{background:#fff;border:2px solid #FFE7D3;border-radius:18px;padding:16px 18px 18px;margin-bottom:16px;}
.step h2{margin:0 0 4px;font-size:18px;color:#E4572E;}
.step .tip{margin:0 0 14px;font-size:14px;color:#8A8078;}

/* 主题卡片 */
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:12px;}
.topic{cursor:pointer;border:2.5px solid #EFE3D6;border-radius:16px;background:#FFFCF8;
  padding:14px 8px 12px;text-align:center;transition:.14s;user-select:none;}
.topic:hover{border-color:#FFC59B;transform:translateY(-2px);}
.topic.on{border-color:#E4572E;background:#FFF2E9;box-shadow:0 0 0 3px #FFE3D1 inset;}
.topic .em{font-size:34px;line-height:1.1;display:block;}
.topic .nm{font-size:15px;font-weight:700;margin-top:8px;color:#4A423A;line-height:1.35;}

/* 点词 */
.bank{margin-bottom:14px;}
.bank .bt{font-size:14px;font-weight:700;color:#2A9D8F;margin:0 0 8px;}
.chips{display:flex;flex-wrap:wrap;gap:10px;}
.chip{cursor:pointer;border:2.5px solid #CFE7E3;background:#F4FBF9;color:#2C6B62;
  border-radius:26px;padding:11px 18px;font-size:17px;font-weight:700;transition:.13s;
  font-family:inherit;line-height:1.3;}
.chip:hover{border-color:#7FC8BE;}
.chip.on{border-color:#2A9D8F;background:#2A9D8F;color:#fff;}

/* 预览句 */
.preview{background:#FFFDF5;border:2px dashed #FFD9A8;border-radius:14px;
  padding:14px 16px;font-size:22px;line-height:1.7;font-weight:700;color:#5A4A3A;min-height:64px;}
.preview .ph{color:#C3B8AA;font-weight:400;font-size:17px;}

/* 文本框 */
textarea{width:100%;min-height:88px;padding:12px 14px;font-size:19px;line-height:1.6;
  border:2.5px solid #E8DCCD;border-radius:12px;outline:none;resize:vertical;
  font-family:inherit;color:#33302C;background:#FFFDFA;}
textarea:focus{border-color:#E4572E;}
.counter{font-size:13px;color:#8A8078;margin:6px 0 0;}
.counter b{color:#E4572E;}
.counter.over b{color:#D62828;}

/* 按钮 */
.btn{cursor:pointer;border:none;border-radius:13px;font-family:inherit;font-weight:700;
  font-size:17px;padding:13px 22px;transition:.12s;}
.btn:disabled{opacity:.42;cursor:not-allowed;}
.btn-ai{background:#457B9D;color:#fff;box-shadow:0 3px 0 #365F7A;}
.btn-ai:hover:enabled{background:#3F7091;}
.btn-ai:active:enabled{transform:translateY(2px);box-shadow:0 1px 0 #365F7A;}
.btn-main{background:#E4572E;color:#fff;box-shadow:0 4px 0 #B84322;font-size:19px;padding:15px 26px;}
.btn-main:hover:enabled{background:#D64E27;}
.btn-main:active:enabled{transform:translateY(2px);box-shadow:0 2px 0 #B84322;}
.btn-ghost{background:#FFF;color:#5A4A3A;border:2.5px solid #E8DCCD;}
.btn-ghost:hover:enabled{border-color:#FFC59B;}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}

/* 工作区（左侧写作+生成/提交按钮，右侧二维码预览；两列底部对齐，预览位置钉死不动） */
.workarea{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;}
.workmain{flex:1 1 320px;min-width:280px;}
.workside{flex:0 0 441px;max-width:100%;}
.qrbox{background:#fff;border:2px solid #FFE7D3;border-radius:18px;padding:16px;
  display:flex;flex-direction:column;align-items:center;}
.sizerow{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;justify-content:center;}
.sizerow .szlab{font-size:14px;font-weight:700;color:#8A8078;}
.szbtn{cursor:pointer;border:2.5px solid #E8DCCD;background:#fff;color:#5A4A3A;border-radius:20px;
  font-family:inherit;font-size:15px;font-weight:700;padding:6px 18px;transition:.12s;}
.szbtn:hover{border-color:#FFC59B;}
.szbtn.on{border-color:#E4572E;background:#E4572E;color:#fff;}
/* 预览框尺寸固定（= 最大档 400 + 边框），二维码只在框内缩放，框本身不动 */
#stage{width:405px;height:405px;border:2.5px dashed #E8DCCD;
  border-radius:14px;display:flex;align-items:center;justify-content:center;background:#fff;
  color:#C3B8AA;font-size:14px;text-align:center;margin-bottom:12px;
  max-width:72vw;max-height:72vw;}
#stage canvas{display:block;width:100%;height:100%;image-rendering:pixelated;}
#msg{font-size:14px;line-height:1.6;text-align:center;min-height:20px;margin-top:10px;}
#msg.err{color:#D62828;font-weight:700;}
#msg.ok{color:#2A9D8F;font-weight:700;}

/* 提交区 */
.submitbox{background:#FFFDF5;border:2px solid #FFE7D3;border-radius:16px;padding:14px 16px;}
.submitbox h3{margin:0 0 10px;font-size:16px;color:#E4572E;}
.field{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.field label{font-size:15px;font-weight:700;color:#5A4A3A;white-space:nowrap;}
.field input{flex:1;min-width:0;padding:11px 12px;font-size:17px;border:2.5px solid #E8DCCD;
  border-radius:11px;outline:none;font-family:inherit;color:#33302C;}
.field input:focus{border-color:#E4572E;}
.sturow{display:flex;gap:8px;flex-wrap:wrap;}
.ssel{flex:1;min-width:90px;padding:11px 10px;font-size:16px;border:2.5px solid #E8DCCD;border-radius:11px;outline:none;font-family:inherit;color:#33302C;background:#fff;}
.ssel:focus{border-color:#E4572E;}
.stuShow{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;color:#2C6B62;}
.stuShow b{color:#E4572E;}
.stuedit{margin-left:auto;cursor:pointer;border:2px solid #BFE4DE;background:#fff;color:#2C6B62;border-radius:16px;font-family:inherit;font-size:13px;font-weight:700;padding:6px 14px;}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(40,32,26,.5);display:none;
  align-items:center;justify-content:center;z-index:60;padding:18px;}
.mask.on{display:flex;}
.modal{background:#fff;border-radius:20px;padding:22px;max-width:420px;width:100%;
  box-shadow:0 18px 50px rgba(0,0,0,.28);text-align:center;}
.modal .em{font-size:44px;}
.modal h3{margin:8px 0 6px;font-size:20px;color:#E4572E;}
.modal p{margin:0 0 16px;font-size:15px;line-height:1.7;color:#5A4A3A;}
.modal .btn{width:100%;}
footer{text-align:center;font-size:13px;color:#B4A99C;padding:8px 20px 34px;line-height:1.8;}
@media print{
  header,.step,.submitbox,.btn,.row,#msg,.sizerow,.workmain,footer{display:none !important;}
  .workarea{display:block;}
  .workside{display:block !important;}
  .qrbox{border:none;padding:0;position:static !important;box-shadow:none !important;}
  #stage{width:120mm !important;height:120mm !important;border:1.4px dashed #999;margin:0 auto;}
  #stage canvas{width:100% !important;height:100% !important;}
  body{background:#fff;}
  @page{size:A4;margin:18mm;}
}
</style>
</head>
<body>

<header>
  <h1>🎨 家乡文化二维码</h1>
  <div class="sub">点一点，就能把家乡介绍出去</div>
  <div class="spacer"></div>
  <a class="survbtn" href="survey.html">📋 填问卷</a>
  <a class="wallbtn" href="wall.html">🏛️ 去看作品墙</a>
</header>

<main>
  <!-- ① 选主题 -->
  <section class="step">
    <h2>① 选一个家乡主题</h2>
    <p class="tip">点一下卡片就选好了，不用打字。</p>
    <div class="topics" id="topics"></div>
  </section>

  <!-- ② 点词拼句 -->
  <section class="step" id="step2" style="display:none;">
    <h2>② 点一点，拼一句话</h2>
    <p class="tip">每一行各选一个词，句子自己就拼好了；想写自己的话，往下到「③ 写进二维码」的框里写。</p>
    <div id="banks"></div>
    <div class="preview" id="preview"></div>
  </section>

  <!-- ③④ 工作区（左侧写作+提交，右侧浮动二维码） -->
  <div class="workarea" id="workarea" style="display:none;">
    <div class="workmain">
      <section class="step" id="step3">
        <h2>③ 写进二维码</h2>
        <p class="tip">点「↺ 用我拼的那句」把上面拼好的句子放进来；也可以完全自己写，直接在下面这个框里打。想改哪个字就改哪个字。</p>
        <div class="row" style="margin-bottom:12px;">
          <button class="btn btn-ghost" id="backfill">↺ 用我拼的那句</button>
        </div>
        <textarea id="txt" maxlength="120" placeholder="点「↺ 用我拼的那句」放进来，或者直接在这里自己写一句话"></textarea>
        <p class="counter" id="counter">已输入 <b>0</b> 字 ｜ 建议 40 字以内，二维码更清楚</p>
      </section>

      <section class="submitbox">
        <h3>④ 送到作品墙，让大家扫码看</h3>
        <div class="field" style="align-items:flex-start;">
          <label style="padding-top:10px;">我是</label>
          <div id="stuBox" style="flex:1;min-width:0;"></div>
        </div>
        <div class="row">
          <button class="btn btn-main" id="go">🎯 生成二维码</button>
          <button class="btn btn-ai" id="submit" disabled>📮 提交到作品墙</button>
        </div>
        <div id="msg"></div>
      </section>
    </div>

    <aside class="workside">
      <div class="qrbox">
        <div class="sizerow" id="sizerow">
          <span class="szlab">二维码大小</span>
          <button type="button" class="szbtn" data-sz="s">小</button>
          <button type="button" class="szbtn on" data-sz="m">中</button>
          <button type="button" class="szbtn" data-sz="l">大</button>
        </div>
        <div id="stage">二维码会出现在这里</div>
        <div class="row" style="width:100%;">
          <button class="btn btn-ghost" id="dl" style="flex:1;" disabled>💾 下载</button>
          <button class="btn btn-ghost" id="pr" style="flex:1;" disabled>🖨️ 打印</button>
        </div>
      </div>
    </aside>
  </div>
</main>

<footer>
  家乡文化社团 ｜ 内容会送给作品墙展示，请写正能量的家乡文化 💛
</footer>

<!-- 成功弹窗 -->
<div class="mask" id="mask">
  <div class="modal">
    <div class="em" id="mEm">🎉</div>
    <h3 id="mTitle">提交成功！</h3>
    <p id="mText"></p>
    <button class="btn btn-main" id="mOk">去看看大家的作品</button>
    <button class="btn btn-ghost" id="mClose" style="margin-top:10px;">留在这一页继续做</button>
  </div>
</div>

      }

      for (var i = 0; i < pos.length; i += 1) {

      while (buffer.getLengthInBits() % 8 != 0) {

<script>/* ===== hometown-qr backend adapter (self-hosted) ===== */
/* ============================================================================
 * 家乡文化二维码 · 自建后端适配器（cloud shim）
 * ----------------------------------------------------------------------------
 * 作用：原页面用 WorkBuddy 云 SDK 的 `cloud.database.from(t).select()/.insert()/
 *       .delete()` 取数。本文件提供**同形状**的替代实现，底层改走自建 API
 *       （api.kexvefuxi.cn/qr/api/...）。这样页面里 14 个调用点一行都不用改。
 *
 * 为什么自己做：原云通道要经第三方免密钥网关 + PKCE，学生一多/换网络就连不上。
 *       自建 API 同域直连，无登录、无外部依赖。
 *
 * 与 _build.py 配合：构建时注入到页面里「云 SDK 占位符」所在的那一行（QR_BACKEND=local）。
 * ==========================================================================*/
(function () {
  'use strict';

  /* 接口基址：取当前页面所在目录 + api/（页面都在 /qr/ 下） */
  function apiBase() {
    var p = location.pathname || '/';
    var i = p.lastIndexOf('/');
    return p.slice(0, i + 1) + 'api/';
  }

  function makeErr(msg) {
    var e = new Error(msg || 'network error');
    e.selfBuilt = true;
    return e;
  }

  /* -------------------------------------------------------------- 查询对象 */
  function Query(table) {
    this.table = table;
    this.mode = 'select';
    this.cols = '*';
    this.orderCol = null;
    this.orderAsc = true;
    this.limitN = 0;
    this.payload = null;
    this.wantSelect = false;
    this.neqs = [];
  }

  Query.prototype.select = function (cols) {
    if (this.mode === 'insert' || this.mode === 'delete') this.wantSelect = true;
    else this.cols = cols || '*';
    return this;
  };
  Query.prototype.insert = function (obj) { this.mode = 'insert'; this.payload = obj || {}; return this; };
  Query.prototype.delete = function () { this.mode = 'delete'; return this; };
  Query.prototype.order = function (col, opt) {
    this.orderCol = col;
    this.orderAsc = !(opt && opt.ascending === false);
    return this;
  };
  Query.prototype.limit = function (n) { this.limitN = Number(n) || 0; return this; };
  Query.prototype.neq = function (col, val) { this.neqs.push({ col: col, val: val }); return this; };

  Query.prototype.then = function (resolve, reject) {
    var self = this;
    var url = apiBase() + self.table;
    var init = { headers: { 'Content-Type': 'application/json' } };

    if (self.mode === 'select') {
      var qs = [];
      if (self.orderCol) qs.push('order=' + encodeURIComponent(self.orderCol + '.' + (self.orderAsc ? 'asc' : 'desc')));
      if (self.limitN > 0) qs.push('limit=' + self.limitN);
      if (self.cols && self.cols !== '*') qs.push('select=' + encodeURIComponent(self.cols));
      if (qs.length) url += '?' + qs.join('&');
      init.method = 'GET';

    } else if (self.mode === 'insert') {
      init.method = 'POST';
      init.body = JSON.stringify(self.payload);

    } else { /* delete：本项目只用「全删」语义（.delete().neq('id', -1)） */
      init.method = 'POST';
      url = apiBase() + 'clear';
      init.body = JSON.stringify({
        tables: [self.table],
        password: (window.CLOUD_CONFIG && window.CLOUD_CONFIG.adminPassword) || ''
      });
    }

    fetch(url, init)
      .then(function (r) {
        return r.text().then(function (t) {
          var j = null;
          try { j = JSON.parse(t); } catch (e) {}
          if (!r.ok) throw makeErr((j && j.error) || ('HTTP ' + r.status));
          if (!j) throw makeErr('返回内容不是 JSON');
          if (j.error) throw makeErr(j.error);
          return j;
        });
      })
      .then(function (j) {
        resolve({ data: j.data || [], error: null });
      })
      .catch(function (e) {
        reject(e);
      });

    return this;
  };

  /* ------------------------------------------------------ 云 SDK 同形替身 */
  window.WorkBuddyCloud = {
    createWorkBuddyCloud: function () {
      return {
        database: { from: function (t) { return new Query(t); } },
        /* 未用到的模块留空壳，防止页面探到时崩 */
        auth: {}, storage: {}, llm: {}
      };
    }
  };

  /* 兼容：模板会检查 CLOUD_CONFIG.endpoint 才建 cloud，这里兜底给个值 */
  if (!window.CLOUD_CONFIG) window.CLOUD_CONFIG = {};
  if (!window.CLOUD_CONFIG.endpoint) window.CLOUD_CONFIG.endpoint = location.origin;

  var _BE = '/* ===== hometown-qr self-hosted backend adapter ===== */';
  if (window.console && console.log) console.log('[qr] 使用自建后端适配器 ' + apiBase());
  try { window.__QR_BACKEND_TAG__ = _BE; } catch (e) {}
})();
</script>

/* ============================================================
   二、安全底线：负向内容拦截（手输、拼接内容都要过这一关）
   ============================================================ */
var BLOCK = ['死','杀','血','滚','傻','笨','丑','蠢','恶心','讨厌','恨','打人','色情','裸','性','赌博','赌','毒','枪','炸','爆炸','自杀','跳楼','恐怖','暴力','鬼','迷信','骗','偷','抢','钱','政治','政府','抗议','反','亡','病','癌','残','穷','垃圾','屎','尿','屁','fuck','shit','bitch'];

function scanBad(s){
  var t = String(s || '');
  var low = t.toLowerCase();
  for (var i = 0; i < BLOCK.length; i++){
    if (low.indexOf(BLOCK[i].toLowerCase()) >= 0) return BLOCK[i];
  }
  return '';
}

/* 过滤控制字符 / 去首尾空白 / 压掉多余空行 */
function clean(s){
  return String(s || '').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
    .replace(/\s+/g, ' ').trim();
}

/* ============================================================
   三、二维码生成（同离线版：先试版本，能装下就画）
   ============================================================ */
if (qrcode.stringToBytesFuncs && qrcode.stringToBytesFuncs['UTF-8']){
  qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
}
function buildQR(text, ec){
  for (var t = 1; t <= 40; t++){
    try { var q = qrcode(t, ec); q.addData(text); q.make(); return { q:q, type:t }; }
    catch(e){}
  }
  return null;
}
function drawQR(text, target){
  var built = buildQR(text, 'M');
  if (!built) return null;
  var q = built.q, n = q.getModuleCount(), quiet = 4, px = n + quiet * 2;
  // 按目标显示尺寸反推模块像素，保证原生分辨率不低于显示尺寸（放大、下载、打印都清晰）
  var size = 8;
  if (target && target > 0) size = Math.max(4, Math.ceil(target / px));
  var cv = document.createElement('canvas');
  cv.width = cv.height = px * size;
  var ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#000';
  for (var r = 0; r < n; r++) for (var c = 0; c < n; c++)
    if (q.isDark(r, c)) ctx.fillRect((c + quiet) * size, (r + quiet) * size, size, size);
  return cv;
}

var $ = function(id){ return document.getElementById(id); };
var state = { topic:null, picks:[null, null, null], text:'', qr:null };

/* ---- 二维码尺寸（大 / 中 / 小）——
   预览框固定 405×405（页面宽度也因此恒定 441px），
   切档只改变框内二维码的大小，左右两列的几何位置完全不变 ---- */
var QRSZ = { s:220, m:300, l:400 };
var curSz = 'm';
function applySize(){
  var cv = $('stage').querySelector('canvas');
  if (!cv) return;
  cv.style.width = QRSZ[curSz] + 'px';
  cv.style.height = QRSZ[curSz] + 'px';
}
function redrawQR(){
  if (!state.qr) return;
  var cv = drawQR(state.qr, QRSZ[curSz] * 2);
  if (!cv) return;
  var st = $('stage'); st.innerHTML = ''; st.appendChild(cv);
  applySize();
}
(function bindSize(){
  var row = $('sizerow'); if (!row) return;
  var btns = row.querySelectorAll('.szbtn');
  Array.prototype.forEach.call(btns, function(b){
    b.onclick = function(){
      curSz = b.getAttribute('data-sz');
      Array.prototype.forEach.call(btns, function(x){ x.classList.toggle('on', x === b); });
      applySize();
      redrawQR();
    };
  });
})();

/* ---- ① 主题卡片 ---- */
var topicsBox = $('topics');
TOPICS.forEach(function(tp){
  var d = document.createElement('div');
  d.className = 'topic';
  d.innerHTML = '<span class="em">' + tp.emoji + '</span><span class="nm">' + tp.name + '</span>';
  d.onclick = function(){ pickTopic(tp.key); };
  topicsBox.appendChild(d);
});

function pickTopic(key){
  var tp = null;
  for (var i = 0; i < TOPICS.length; i++) if (TOPICS[i].key === key) tp = TOPICS[i];
  if (!tp) return;
  state.topic = tp;
  state.picks = [null, null, null];
  state.text = '';
  // 卡片高亮
  var cards = topicsBox.children;
  for (var j = 0; j < cards.length; j++) cards[j].classList.toggle('on', TOPICS[j].key === key);
  // 渲染词条
  var banks = $('banks');
  banks.innerHTML = '';
  tp.banks.forEach(function(bk, bi){
    var wrap = document.createElement('div');
    wrap.className = 'bank';
    var h = document.createElement('p'); h.className = 'bt'; h.textContent = '第' + (bi+1) + '行 · ' + bk.t;
    wrap.appendChild(h);
    var chips = document.createElement('div'); chips.className = 'chips';
    bk.items.forEach(function(it){
      var c = document.createElement('button');
      c.type = 'button'; c.className = 'chip'; c.textContent = it;
      c.onclick = function(){
        var sib = chips.children;
        for (var k = 0; k < sib.length; k++) sib[k].classList.remove('on');
        c.classList.add('on');
        state.picks[bi] = it;
        refreshPreview();
      };
      chips.appendChild(c);
    });
    wrap.appendChild(chips);
    banks.appendChild(wrap);
  });
  $('step2').style.display = '';
  $('workarea').style.display = 'flex';
  refreshPreview();
  $('txt').value = '';
  updateCounter();
  resetQR();
  $('msg').textContent = '';
  /* 不自动滚动页面：选完主题后停留原位，由使用者自己决定是否往下看 */
}

function composed(){
  if (!state.topic) return '';
  var p = state.picks;
  if (!p[0] || !p[1] || !p[2]) return '';
  return p[0] + '，' + p[1] + '。' + p[2] + '。';
}
function refreshPreview(){
  var s = composed();
  var box = $('preview');
  if (s){ box.textContent = s; }
  else {
    var got = 0;
    for (var i = 0; i < 3; i++) if (state.picks[i]) got++;
    box.innerHTML = '<span class="ph">' + (got === 0 ? '每一行选一个词，句子就会出现在这里 ✨'
      : '还差 ' + (3 - got) + ' 个，继续选一选 👆') + '</span>';
  }
}

var txt = $('txt');

  var n = txt.value.length;

  c.innerHTML = '已输入 <b>' + n + '</b> 字 ｜ ' + (n === 0 ? '建议 40 字以内，二维码更清楚'

/* ---- 二维码预览 ---- */
function resetQR(){
  state.qr = null;
  $('stage').innerHTML = '二维码会出现在这里';
  $('dl').disabled = $('pr').disabled = true;
  $('submit').disabled = true;
}
function renderQR(){
  var s = clean(state.text);
  if (!s){ $('msg').className = 'msg err'; $('msg').textContent = '先写好一句话，再点生成。'; return; }
  if (s.length > 100){
    $('msg').className = 'msg err';
    $('msg').textContent = '内容太长（' + s.length + ' 字），二维码会糊，请精简到 40 字左右。';
    return;
  }
  var bad = scanBad(s);
  if (bad){
    $('msg').className = 'msg err';
    $('msg').textContent = '这句话里有不合适的内容，换一句吧～';
    return;
  }
  var cv = drawQR(s, QRSZ[curSz] * 2);
  if (!cv){ $('msg').className = 'msg err'; $('msg').textContent = '内容太长，二维码装不下，请精简。'; return; }
  var st = $('stage'); st.innerHTML = ''; st.appendChild(cv);
  state.qr = s;
  applySize();
  $('dl').disabled = $('pr').disabled = false;
  $('submit').disabled = false;
  $('msg').className = 'msg ok';
  $('msg').textContent = '二维码做好啦！可以提交到作品墙了 🎉';
}

$('go').onclick = function(){
  state.text = txt.value;
  if (!clean(state.text)){
    if (composed()){ txt.value = composed(); state.text = txt.value; updateCounter(); }
    else { $('msg').className = 'msg err'; $('msg').textContent = '先写好一句话，再点生成。'; return; }
  }
  renderQR();
};

/* ---- 下载 / 打印 ---- */
$('dl').onclick = function(){
  var cv = $('stage').querySelector('canvas'); if (!cv) return;
  var a = document.createElement('a');
  a.download = '家乡文化二维码-' + new Date().toISOString().slice(0,10) + '.png';
  a.href = cv.toDataURL('image/png'); a.click();
};
$('pr').onclick = function(){ window.print(); };

/* ============================================================
   五、云服务（作品墙 / 问卷的数据读写）
   ============================================================ */
var cloud = null;
try {
  if (window.WorkBuddyCloud && window.CLOUD_CONFIG && window.CLOUD_CONFIG.endpoint){
    cloud = window.WorkBuddyCloud.createWorkBuddyCloud({
      endpoint: window.CLOUD_CONFIG.endpoint,
      oauthRelayBaseUrl: window.CLOUD_CONFIG.oauthRelayBaseUrl,
      publishableKey: window.CLOUD_CONFIG.publishableKey
    });
  }
} catch(e){ cloud = null; }

/* ============================================================
   五之二、全站通用身份（年级 / 班级 / 学号）
   ============================================================ */
var LS_STU = 'cx_student';
var GRADES = ['三年级','四年级','五年级','六年级'];
var CLASSES = (function(){ var a=[]; for(var i=1;i<=12;i++) a.push(i+'班'); return a; })();
var NUMBERS = (function(){ var a=[]; for(var i=1;i<=50;i++) a.push(i+'号'); return a; })();
function stuGet(){ try { var v = localStorage.getItem(LS_STU); if(!v) return null; var o = JSON.parse(v); return (o && o.grade && o.klass && o.no) ? o : null; } catch(e){ return null; } }
function stuSet(o){ try { localStorage.setItem(LS_STU, JSON.stringify(o)); } catch(e){} }
function stuLabel(o){ return o ? (o.grade + o.klass + ' · ' + o.no) : ''; }

var STUDENT = stuGet();
var idEditing = !STUDENT;

function fillSel(el, arr, cur, ph){
  el.innerHTML = '<option value="">' + ph + '</option>' + arr.map(function(v){
    return '<option value="' + v + '"' + (v === cur ? ' selected' : '') + '>' + v + '</option>';
  }).join('');
}
function renderStu(){
  var box = $('stuBox'); if (!box) return;
  if (STUDENT && !idEditing){
    box.innerHTML = '<div class="stuShow">👦 <b>' + stuLabel(STUDENT) + '</b>'
      + '<button type="button" class="stuedit" id="stuEdit">改一改</button></div>';
    $('stuEdit').onclick = function(){ idEditing = true; renderStu(); };
  } else {
    box.innerHTML = '<div class="sturow">'
      + '<select class="ssel" id="selGrade"></select>'
      + '<select class="ssel" id="selClass"></select>'
      + '<select class="ssel" id="selNo"></select></div>';
    fillSel($('selGrade'), GRADES, STUDENT ? STUDENT.grade : '四年级', '年级');
    fillSel($('selClass'), CLASSES, STUDENT ? STUDENT.klass : '', '班级');
    fillSel($('selNo'), NUMBERS, STUDENT ? STUDENT.no : '', '学号');
    ['selGrade','selClass','selNo'].forEach(function(id){
      $(id).onchange = function(){
        var g = $('selGrade').value, c = $('selClass').value, n = $('selNo').value;
        if (g && c && n){ STUDENT = { grade:g, klass:c, no:n }; stuSet(STUDENT); idEditing = false; renderStu(); }
      };
    });
  }
}

/* ============================================================
   六、提交到作品墙
   ============================================================ */
function setMsg(cls, t){ $('msg').className = 'msg ' + (cls || ''); $('msg').textContent = t; }

$('submit').onclick = async function(){
  var s = clean(state.text);
  if (!state.qr){ setMsg('err', '先生成二维码，再提交哦。'); return; }
  var stu = STUDENT;
  if (!stu){ setMsg('err', '先在最上面选一下你是谁（年级 / 班级 / 学号）。'); return; }
  var author = stu.no, klass = stu.grade + stu.klass;
  var bad = scanBad(s) || scanBad(author) || scanBad(klass);
  if (bad){ setMsg('err', '内容里有不合适的地方，改一改再提交吧～'); return; }
  if (!cloud){
    setMsg('err', '现在连不上作品墙（网络或服务未就绪），可以先下载二维码，稍后再交。');
    return;
  }
  var btn = $('submit'); btn.disabled = true; setMsg('', '正在送到作品墙…');
  try {
    var res = await cloud.database.from('works').insert({
      author: author, klass: klass,
      topic: state.topic.key, topic_name: state.topic.name,
      content: s
    }).select();
    if (res.error) throw res.error;
    if (!res.data || !res.data.length){ setMsg('err', '提交没有成功，请再试一次。'); return; }
    setMsg('ok', '');
    showDone(author, s);
  } catch(e){
    setMsg('err', '提交失败：' + (e && e.message ? e.message : '网络问题') + '，请再试一次。');
  } finally {
    btn.disabled = false;
  }
};

/* ---- 成功弹窗 ---- */
function showDone(author, content){
  $('mText').innerHTML = '“' + escapeHtml(content) + '”<br>已经挂到作品墙上啦，快去和大家互相点赞吧！';
  $('mask').classList.add('on');
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
$('mOk').onclick = function(){ location.href = 'wall.html'; };
$('mClose').onclick = function(){ $('mask').classList.remove('on'); };

renderStu();
updateCounter();
applySize();
})();
</script>
</body>
</html>
