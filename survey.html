<script>/* ===== hometown-qr backend adapter (self-hosted) ===== */
/* ============================================================================
 * 家乡文化二维码 · 自建后端适配器（cloud shim）
 * ----------------------------------------------------------------------------
 * 作用：原页面用 WorkBuddy 云 SDK 的 `cloud.database.from(t).select()/.insert()/
 *       .delete()` 取数。本文件提供**同形状**的替代实现，底层改走自建 API
 *       （api.kexvefuxi.cn/qr/api/...）。这样页面里 14 个调用点一行都不用改。
 *
 * 为什么自己做：原云通道要经第三方免密钥网关 + PKCE，学生一多/换网络就连不上。
 *       自建 API 同域直连，无登录、无外部依赖。
 *
 * 与 _build.py 配合：构建时注入到页面里「云 SDK 占位符」所在的那一行（QR_BACKEND=local）。
 * ==========================================================================*/
(function () {
  'use strict';

  /* 接口基址：取当前页面所在目录 + api/（页面都在 /qr/ 下） */
  function apiBase() {
    var p = location.pathname || '/';
    var i = p.lastIndexOf('/');
    return p.slice(0, i + 1) + 'api/';
  }

  function makeErr(msg) {
    var e = new Error(msg || 'network error');
    e.selfBuilt = true;
    return e;
  }

  /* -------------------------------------------------------------- 查询对象 */
  function Query(table) {
    this.table = table;
    this.mode = 'select';
    this.cols = '*';
    this.orderCol = null;
    this.orderAsc = true;
    this.limitN = 0;
    this.payload = null;
    this.wantSelect = false;
    this.neqs = [];
  }

  Query.prototype.select = function (cols) {
    if (this.mode === 'insert' || this.mode === 'delete') this.wantSelect = true;
    else this.cols = cols || '*';
    return this;
  };
  Query.prototype.insert = function (obj) { this.mode = 'insert'; this.payload = obj || {}; return this; };
  Query.prototype.delete = function () { this.mode = 'delete'; return this; };
  Query.prototype.order = function (col, opt) {
    this.orderCol = col;
    this.orderAsc = !(opt && opt.ascending === false);
    return this;
  };
  Query.prototype.limit = function (n) { this.limitN = Number(n) || 0; return this; };
  Query.prototype.neq = function (col, val) { this.neqs.push({ col: col, val: val }); return this; };

  Query.prototype.then = function (resolve, reject) {
    var self = this;
    var url = apiBase() + self.table;
    var init = { headers: { 'Content-Type': 'application/json' } };

    if (self.mode === 'select') {
      var qs = [];
      if (self.orderCol) qs.push('order=' + encodeURIComponent(self.orderCol + '.' + (self.orderAsc ? 'asc' : 'desc')));
      if (self.limitN > 0) qs.push('limit=' + self.limitN);
      if (self.cols && self.cols !== '*') qs.push('select=' + encodeURIComponent(self.cols));
      if (qs.length) url += '?' + qs.join('&');
      init.method = 'GET';

    } else if (self.mode === 'insert') {
      init.method = 'POST';
      init.body = JSON.stringify(self.payload);

    } else { /* delete：本项目只用「全删」语义（.delete().neq('id', -1)） */
      init.method = 'POST';
      url = apiBase() + 'clear';
      init.body = JSON.stringify({
        tables: [self.table],
        password: (window.CLOUD_CONFIG && window.CLOUD_CONFIG.adminPassword) || ''
      });
    }

    fetch(url, init)
      .then(function (r) {
        return r.text().then(function (t) {
          var j = null;
          try { j = JSON.parse(t); } catch (e) {}
          if (!r.ok) throw makeErr((j && j.error) || ('HTTP ' + r.status));
          if (!j) throw makeErr('返回内容不是 JSON');
          if (j.error) throw makeErr(j.error);
          return j;
        });
      })
      .then(function (j) {
        resolve({ data: j.data || [], error: null });
      })
      .catch(function (e) {
        reject(e);
      });

    return this;
  };

  /* ------------------------------------------------------ 云 SDK 同形替身 */
  window.WorkBuddyCloud = {
    createWorkBuddyCloud: function () {
      return {
        database: { from: function (t) { return new Query(t); } },
        /* 未用到的模块留空壳，防止页面探到时崩 */
        auth: {}, storage: {}, llm: {}
      };
    }
  };

  /* 兼容：模板会检查 CLOUD_CONFIG.endpoint 才建 cloud，这里兜底给个值 */
  if (!window.CLOUD_CONFIG) window.CLOUD_CONFIG = {};
  if (!window.CLOUD_CONFIG.endpoint) window.CLOUD_CONFIG.endpoint = location.origin;

  var _BE = '/* ===== hometown-qr self-hosted backend adapter ===== */';
  if (window.console && console.log) console.log('[qr] 使用自建后端适配器 ' + apiBase());
  try { window.__QR_BACKEND_TAG__ = _BE; } catch (e) {}
})();
</script>

var NUMBERS = (function(){ var a=[]; for(var i=1;i<=50;i++) a.push(i+'号'); return a; })();
function stuGet(){ try { var v = localStorage.getItem(LS_STU); if(!v) return null; var o = JSON.parse(v); return (o && o.grade && o.klass && o.no) ? o : null; } catch(e){ return null; } }
function stuSet(o){ try { localStorage.setItem(LS_STU, JSON.stringify(o)); } catch(e){} }
function stuLabel(o){ return o ? (o.grade + o.klass + ' · ' + o.no) : ''; }

var STUDENT = stuGet();
var idEditing = !STUDENT;

function fillSel(el, arr, cur, ph){
  el.innerHTML = '<option value="">' + ph + '</option>' + arr.map(function(v){
    return '<option value="' + v + '"' + (v === cur ? ' selected' : '') + '>' + v + '</option>';
  }).join('');
}
function renderStu(){
  var box = $('stuBox'); if (!box) return;
  if (STUDENT && !idEditing){
    box.innerHTML = '<div class="stuShow">👦 <b>' + esc(stuLabel(STUDENT)) + '</b>'
      + '<button type="button" class="stuedit" id="stuEdit">改一改</button></div>';
    $('stuEdit').onclick = function(){ idEditing = true; renderStu(); };
  } else {
    box.innerHTML = '<div class="sturow">'
      + '<select class="ssel" id="selGrade"></select>'
      + '<select class="ssel" id="selClass"></select>'
      + '<select class="ssel" id="selNo"></select></div>';
    fillSel($('selGrade'), GRADES, STUDENT ? STUDENT.grade : '四年级', '年级');
    fillSel($('selClass'), CLASSES, STUDENT ? STUDENT.klass : '', '班级');
    fillSel($('selNo'), NUMBERS, STUDENT ? STUDENT.no : '', '学号');
    ['selGrade','selClass','selNo'].forEach(function(id){
      $(id).onchange = function(){
        var g = $('selGrade').value, c = $('selClass').value, n = $('selNo').value;
        if (g && c && n){ STUDENT = { grade:g, klass:c, no:n }; stuSet(STUDENT); idEditing = false; renderStu(); }
      };
    });
  }
}
function identity(){
  var o = STUDENT;
  return { author: o ? o.no : '', klass: o ? (o.grade + o.klass) : '', ok: !!o, label: stuLabel(o) };
}
function applyIdentity(){
  var id = identity();
  if (id.ok && !idEditing){
    $('idbox').style.display = 'none';
    $('whoami').style.display = '';
    $('whoName').textContent = id.label;
  } else {
    $('idbox').style.display = '';
    $('whoami').style.display = 'none';
    renderStu();
  }
}
function needIdentity(){
  if (!identity().ok){
    idEditing = true;
    $('idbox').style.display = '';
    $('whoami').style.display = 'none';
    renderStu();
    $('msg').className = 'msg err';
    $('msg').textContent = '先在上面选一下你是谁哦～';
    window.scrollTo({ top:0, behavior:'smooth' });
    return true;
  }
  return false;
}
$('changeWho').onclick = function(){ idEditing = true; applyIdentity(); };

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* ---------- 云服务 ---------- */
var cloud = null;
try {
  if (window.WorkBuddyCloud && window.CLOUD_CONFIG && window.CLOUD_CONFIG.endpoint){
    cloud = window.WorkBuddyCloud.createWorkBuddyCloud({
      endpoint: window.CLOUD_CONFIG.endpoint,
      oauthRelayBaseUrl: window.CLOUD_CONFIG.oauthRelayBaseUrl,
      publishableKey: window.CLOUD_CONFIG.publishableKey
    });
  }
} catch(e){ cloud = null; }

/* ---------- 切换问卷 ---------- */
function renderTabs(){
  var box = $('tabs'); box.innerHTML = '';
  SURVEYS.forEach(function(s, i){
    var b = document.createElement('button');
    b.innerHTML = (DONE[s.key] ? '✅ ' : '') + esc(s.name) + ' <span class="dot">' + esc(s.dot) + '</span>';
    b.className = i === curIdx ? 'on' : '';
    b.onclick = function(){ curIdx = i; renderTabs(); renderQs(); $('msg').textContent=''; window.scrollTo({top:0,behavior:'smooth'}); };
    box.appendChild(b);
  });
}
applyIdentity();

/* ---------- 渲染题目 ---------- */
function renderQs(){
  var s = SURVEYS[curIdx];
  var box = $('qbox'); box.innerHTML = '';
  var st = STATE[s.key];

  s.qs.forEach(function(q, qi){
    var wrap = document.createElement('div'); wrap.className = 'q';
    var qh = document.createElement('div'); qh.className = 'qh';
    var no = document.createElement('span'); no.className = 'no'; no.textContent = qi + 1;
    var qt = document.createElement('span'); qt.className = 'qt';
    qt.textContent = q.t + (q.type === 'multi' ? '（可多选）' : '');
    qh.appendChild(no); qh.appendChild(qt); wrap.appendChild(qh);

    if (q.type === 'text'){
      var ta = document.createElement('textarea');
      ta.maxLength = 80; ta.placeholder = q.ph || '';
      ta.value = st[q.id] || '';
      var n = document.createElement('p'); n.className = 'qn'; n.textContent = '最多 80 字';
      var setHint = function(msg, warn){
        n.textContent = msg || '最多 80 字';
        if (warn) n.classList.add('warn'); else n.classList.remove('warn');
      };
      var pickBtns = [];
      var syncPick = function(){
        for (var pi = 0; pi < pickBtns.length; pi++){
          pickBtns[pi].classList.toggle('on', (ta.value || '').indexOf(pickBtns[pi].textContent) >= 0);
        }
      };
      // 预置短语：点一下放进去，再点一下取消；也可以完全自己写
      if (q.picks && q.picks.length){
        var pk = document.createElement('div'); pk.className = 'tpicks';
        var plab = document.createElement('p'); plab.className = 'tpk-lab';
        plab.textContent = '想不到怎么写？点一句放进去，也可以自己写：';
        pk.appendChild(plab);
        var prow = document.createElement('div'); prow.className = 'tpk-row';
        q.picks.forEach(function(p){
          var b = document.createElement('button');
          b.type = 'button'; b.className = 'tpick'; b.textContent = p;
          b.onclick = function(){
            var cur = ta.value || '';
            if (cur.indexOf(p) >= 0){
              var nx = cur.split(p).join('');
              nx = nx.replace(/[。！？…][，、]+/g, function(mm){ return mm.charAt(0); });
              nx = nx.replace(/[，、]{2,}/g, '，');
              nx = nx.replace(/^[，,、\s　]+/, '').replace(/[，,、\s　]+$/, '');
              ta.value = nx;
              setHint();
            } else {
              var tail = cur.replace(/[\s　]+$/, '');
              var sep = (/[。！？…～!?]$/.test(tail) ? '' : '，');
              var joined = tail ? (tail + sep + p) : p;
              if (joined.length > 80){ setHint('已经 80 字啦，先去掉一句再选吧～', true); return; }
              ta.value = joined;
              setHint();
            }
            st[q.id] = ta.value; saveState(); syncPick();
          };
          pickBtns.push(b); prow.appendChild(b);
        });
        pk.appendChild(prow);
        wrap.appendChild(pk);
      }
      ta.oninput = function(){ st[q.id] = ta.value; saveState(); setHint(); syncPick(); };
      wrap.appendChild(ta);
      wrap.appendChild(n);
      syncPick();
    } else {
      var opts = document.createElement('div');
      opts.className = 'opts' + (q.type === 'multi' && q.opts.some(function(o){ return o.length > 6; }) ? ' col' : '');
      q.opts.forEach(function(o){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'opt'; b.textContent = o;
        var selected = q.type === 'multi'
          ? (st[q.id] || []).indexOf(o) >= 0
          : st[q.id] === o;
        if (selected) b.classList.add('on');
        b.onclick = function(){
          if (q.type === 'multi'){
            var arr = st[q.id] || (st[q.id] = []);
            var k = arr.indexOf(o);
            if (k >= 0) arr.splice(k, 1); else arr.push(o);
            b.classList.toggle('on', k < 0);
          } else {
            st[q.id] = o;
            var sib = opts.children;
            for (var m = 0; m < sib.length; m++) sib[m].classList.remove('on');
            b.classList.add('on');
          }
          saveState();
        };
        opts.appendChild(b);
      });
      wrap.appendChild(opts);
    }
    box.appendChild(wrap);
  });
}

/* ---------- 交卷 ---------- */
$('send').onclick = async function(){
  if (needIdentity()) return;
  var s = SURVEYS[curIdx], st = STATE[s.key];
  var id = identity();
  var author = id.author, klass = id.klass;

  /* 检查必答：single 都答、multi 至少选一项；text 可空 */
  for (var i = 0; i < s.qs.length; i++){
    var q = s.qs[i];
    if (q.type === 'text') continue;
    var v = st[q.id];
    var empty = q.type === 'multi' ? (!v || !v.length) : (!v);
    if (empty){
      $('msg').className = 'msg err';
      $('msg').textContent = '第 ' + (i + 1) + ' 题还没选哦～';
      return;
    }
  }
  if (!cloud){ $('msg').className = 'msg err'; $('msg').textContent = '连不上服务，稍后再交。'; return; }

  var btn = $('send'); btn.disabled = true;
  $('msg').className = 'msg'; $('msg').textContent = '正在交卷…';
  try {
    var res = await cloud.database.from('surveys').insert({
      kind: s.key, author: author, klass: klass, answers: st
    }).select();
    if (res.error) throw res.error;
    if (!res.data || !res.data.length) throw new Error('未写入');
    /* 标记这份已交（身份在选定时已记忆，全站通用） */
    DONE[s.key] = 1; saveDone();
    $('msg').className = 'msg ok'; $('msg').textContent = '';

    /* 找下一份还没交的问卷 */
    var nextIdx = -1;
    for (var k = 0; k < SURVEYS.length; k++){ if (!DONE[SURVEYS[k].key]){ nextIdx = k; break; } }
    var allDone = nextIdx < 0;
    $('mTitle').textContent = allDone ? '三份都填完啦！' : (s.name + ' 交卷成功！');
    $('mText').innerHTML = allDone ? '谢谢你，三份问卷都完成啦 🎉<br>可以去做家乡文化二维码啦！'
      : '谢谢你的回答，老师收到啦！<br><span style="color:#8A8078;font-size:14px;">你的身份已记住，剩下的问卷不用再选。</span>';
    $('mNext').textContent = allDone ? '去做家乡文化二维码' : ('接着填「' + SURVEYS[nextIdx].name + '」');
    $('mNext').onclick = function(){
      $('mask').classList.remove('on');
      if (allDone){ location.href = 'index.html'; }
      else { curIdx = nextIdx; renderTabs(); renderQs(); $('msg').textContent = ''; window.scrollTo({top:0,behavior:'smooth'}); }
    };
    $('mask').classList.add('on');
    applyIdentity();
    renderTabs();
  } catch(e){
    $('msg').className = 'msg err';
    $('msg').textContent = '交卷失败：' + (e && e.message ? e.message : '网络问题') + '，请再试一次。';
  } finally { btn.disabled = false; }
};
$('mClose').onclick = function(){ $('mask').classList.remove('on'); };

applyIdentity(); renderTabs(); renderQs();
})();
</script>
</body>
</html>
