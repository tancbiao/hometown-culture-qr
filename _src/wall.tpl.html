<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家乡文化作品墙</title>
<style>
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:#FFF9F2;color:#33302C;
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;-webkit-text-size-adjust:100%;}
header{background:#fff;border-bottom:3px solid #FFE0C7;padding:14px 20px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
header h1{margin:0;font-size:24px;}
header .sub{font-size:14px;color:#8A8078;}
header .spacer{flex:1;}
header a{font-size:15px;font-weight:700;color:#fff;text-decoration:none;
  background:#E4572E;border-radius:22px;padding:9px 20px;box-shadow:0 3px 0 #B84322;transition:.12s;}
header a:hover{background:#D64E27;}
header a:active{transform:translateY(2px);box-shadow:0 1px 0 #B84322;}
header button.adminbtn{font-size:14px;font-weight:700;color:#5A4A3A;background:#fff;border:2.5px solid #E8DCCD;
  border-radius:22px;padding:8px 16px;cursor:pointer;font-family:inherit;transition:.12s;}
header button.adminbtn:hover{border-color:#FFC59B;background:#FFFDF8;}

.bar{max-width:1320px;margin:0 auto;padding:14px 20px 0;display:flex;gap:12px;
  align-items:center;flex-wrap:wrap;}
.stat{font-size:15px;color:#5A4A3A;font-weight:700;}
.stat b{color:#E4572E;font-size:19px;}
.seg{margin-left:auto;display:flex;border:2.5px solid #FFD9B8;border-radius:24px;overflow:hidden;background:#fff;}
.seg button{border:none;background:transparent;font-family:inherit;font-size:15px;font-weight:700;
  color:#B4815E;padding:9px 18px;cursor:pointer;}
.seg button.on{background:#E4572E;color:#fff;}
.refresh{border:2.5px solid #E8DCCD;background:#fff;border-radius:24px;font-family:inherit;
  font-size:15px;font-weight:700;color:#5A4A3A;padding:9px 18px;cursor:pointer;}

main{max-width:1320px;margin:0 auto;padding:16px 20px 60px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:16px;}
.card{background:#fff;border:2px solid #FFE7D3;border-radius:18px;padding:14px;
  display:flex;flex-direction:column;transition:.15s;}
.card:hover{box-shadow:0 8px 22px rgba(228,87,46,.13);transform:translateY(-2px);}
.card .qr{width:132px;height:132px;margin:0 auto 10px;border:2px solid #F0E6DA;border-radius:12px;
  display:flex;align-items:center;justify-content:center;background:#fff;cursor:zoom-in;overflow:hidden;}
.card .qr canvas{width:100%;height:100%;image-rendering:pixelated;}
.card .txt{font-size:17px;line-height:1.6;font-weight:700;color:#4A423A;flex:1;
  word-break:break-word;min-height:56px;}
.card .tp{display:inline-block;font-size:13px;font-weight:700;color:#2C6B62;background:#EAF7F4;
  border-radius:14px;padding:3px 12px;margin-bottom:8px;}
.card .meta{display:flex;align-items:center;gap:8px;font-size:13px;color:#8A8078;margin-top:10px;}
.card .meta .who{font-weight:700;color:#5A4A3A;}
.card .act{margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.card .stars{font-size:14.5px;color:#F2A100;font-weight:700;flex:1 1 100%;white-space:nowrap;}
.card .rate{cursor:pointer;border:none;border-radius:11px;background:#2A9D8F;color:#fff;
  font-family:inherit;font-weight:700;font-size:14px;padding:9px 14px;box-shadow:0 3px 0 #1F7D72;
  flex:1;text-align:center;}
.card .rate:active{transform:translateY(2px);box-shadow:0 1px 0 #1F7D72;}
.card .rate.done{background:#B7CFCB;box-shadow:0 3px 0 #9BB8B4;}
.card .dtbtn{cursor:pointer;border:2.5px solid #E8DCCD;border-radius:11px;background:#fff;color:#5A4A3A;
  font-family:inherit;font-weight:700;font-size:13px;padding:8px 12px;flex:1;text-align:center;}
.card .dtbtn:hover{border-color:#FFC59B;background:#FFFDF8;}
.sturow{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 12px;}
.ssel{flex:1;min-width:84px;padding:10px;font-size:15px;border:2.5px solid #E8DCCD;border-radius:11px;
  outline:none;font-family:inherit;color:#33302C;background:#fff;}
.ssel:focus{border-color:#E4572E;}
.stuShow{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;color:#2C6B62;
  background:#EAF7F4;border:2px solid #BFE4DE;border-radius:12px;padding:8px 12px;margin:2px 0 12px;}
.stuShow b{color:#E4572E;}
.stuShow .stuedit{margin-left:auto;cursor:pointer;border:2px solid #BFE4DE;background:#fff;color:#2C6B62;
  border-radius:14px;font-family:inherit;font-size:12px;font-weight:700;padding:5px 12px;}
.dtlist{max-height:46vh;overflow:auto;text-align:left;margin:2px 0 14px;border-top:1px solid #F2EADD;}
.dtrow{display:flex;gap:8px;align-items:baseline;padding:10px 2px;border-bottom:1px solid #F2EADD;}
.dtrow .dtwho{font-weight:700;color:#5A4A3A;font-size:14px;white-space:nowrap;}
.dtrow .dtst{color:#F2A100;font-weight:700;white-space:nowrap;letter-spacing:1px;}
.dtrow .dtcmt{flex:1;color:#3A332C;font-size:15px;line-height:1.5;word-break:break-word;}
.dtrow .dttime{color:#B4A99C;font-size:12px;white-space:nowrap;}
.dtempty{color:#9AA6B2;font-size:14px;padding:14px 2px;text-align:center;}

.empty{text-align:center;color:#B4A99C;font-size:17px;padding:70px 20px;line-height:2;}
.empty .em{font-size:52px;display:block;margin-bottom:10px;}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(40,32,26,.55);display:none;
  align-items:center;justify-content:center;z-index:60;padding:18px;}
.mask.on{display:flex;}
.modal{background:#fff;border-radius:20px;padding:22px;max-width:430px;width:100%;
  box-shadow:0 18px 50px rgba(0,0,0,.3);max-height:92vh;overflow:auto;}
.modal h3{margin:0 0 4px;font-size:20px;color:#E4572E;}
.modal .q{font-size:16px;line-height:1.6;color:#5A4A3A;background:#FFFDF5;border-radius:12px;
  padding:10px 12px;margin:10px 0 14px;word-break:break-word;}
.pick{display:flex;gap:8px;justify-content:center;margin-bottom:6px;}
.pick .st{font-size:38px;cursor:pointer;color:#E3D8CB;transition:.12s;line-height:1;user-select:none;}
.pick .st.on,.pick .st:hover{color:#F2A100;transform:scale(1.12);}
.plabel{text-align:center;font-size:14px;color:#8A8078;margin:0 0 14px;}
textarea{width:100%;min-height:74px;padding:11px 12px;font-size:16px;line-height:1.6;
  border:2.5px solid #E8DCCD;border-radius:12px;outline:none;resize:vertical;
  font-family:inherit;color:#33302C;background:#FFFDFA;}
textarea:focus{border-color:#E4572E;}
.mrow{display:flex;gap:10px;margin-top:14px;}
.btn{cursor:pointer;border:none;border-radius:12px;font-family:inherit;font-weight:700;
  font-size:16px;padding:12px 18px;flex:1;transition:.12s;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-main{background:#E4572E;color:#fff;box-shadow:0 3px 0 #B84322;}
.btn-main:active:enabled{transform:translateY(2px);box-shadow:0 1px 0 #B84322;}
.btn-ghost{background:#FFF;color:#5A4A3A;border:2.5px solid #E8DCCD;}
.mmsg{font-size:14px;text-align:center;margin-top:10px;min-height:18px;}
.mmsg.err{color:#D62828;font-weight:700;}
.mmsg.ok{color:#2A9D8F;font-weight:700;}

/* 管理员登录/清除弹窗 */
.mrow{display:flex;gap:10px;margin-top:14px;}
.mrow .btn{flex:1;}
.modal input.pw{width:100%;padding:12px;font-size:16px;border:2.5px solid #E8DCCD;border-radius:11px;
  outline:none;font-family:inherit;text-align:center;letter-spacing:.06em;}
.modal input.pw:focus{border-color:#E4572E;}
.warnbox{background:#FFF4F2;border:2px solid #F5C9C2;border-radius:12px;padding:11px 13px;
  font-size:14px;color:#A93226;line-height:1.7;margin:12px 0;}
.warnbox label{display:flex;align-items:center;gap:8px;font-weight:700;margin-top:6px;font-size:14px;}
.warnbox input[type=checkbox]{width:18px;height:18px;flex:none;accent-color:#A93226;}

/* 看大图 */
.viewer .modal{max-width:470px;}
.viewer .big{width:min(296px,66vw);height:min(296px,66vw);margin:2px auto 8px;}
.viewer .big canvas{width:100%;height:100%;image-rendering:pixelated;}
.viewer .cap{font-size:16px;line-height:1.7;color:#4A423A;font-weight:700;text-align:center;}
.viewer .who{font-size:14px;color:#8A8078;text-align:center;margin-top:8px;}

/* 看大图里的「大家的评价」 */
.vsec{margin-top:14px;border-top:2px dashed #F2EADD;padding-top:12px;}
.vsec .vsec-t{font-size:15px;font-weight:800;color:#E4572E;margin-bottom:8px;
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.vsec .vsum{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
  font-size:13px;color:#8A8078;margin-bottom:8px;}
.vsec .vsum .vavg{font-size:20px;font-weight:800;color:#F2A100;line-height:1;}
.vsec .dtlist{max-height:32vh;}

/* 卡片上的最新评语预览：还没点进去就能看到别人说了什么 */
.card .cmt{margin-top:9px;padding:8px 11px;background:#FFF8F0;border-left:3px solid #FFD9B8;
  border-radius:0 10px 10px 0;font-size:13.5px;line-height:1.55;color:#5A4A3A;
  cursor:pointer;word-break:break-word;transition:.12s;}
.card .cmt:hover{background:#FFF3E6;}
.card .cmt .by{display:block;font-size:12px;color:#A89A8C;margin-top:5px;text-align:right;font-weight:700;}
footer{text-align:center;font-size:13px;color:#B4A99C;padding:10px 20px 40px;}
</style>
</head>
<body>

<header>
  <h1>🏛️ 家乡文化作品墙</h1>
  <div class="sub">扫码看看，给同学点个赞</div>
  <div class="spacer"></div>
  <button class="adminbtn" id="adminBtn">🔒 管理员</button>
  <a href="index.html">✏️ 我也要做一个</a>
</header>

<div class="bar">
  <span class="stat">一共 <b id="cnt">0</b> 件作品</span>
  <div class="seg">
    <button data-sort="new" class="on">最新发布</button>
    <button data-sort="hot">最受欢迎</button>
    <button data-sort="cmt">评论最多</button>
  </div>
  <button class="refresh" id="refresh">🔄 刷新</button>
</div>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none;">
    <span class="em">🌱</span>
    还没有作品呢，<br>快去做第一个吧！
  </div>
</main>

<footer>点一点，让家乡文化被更多人看见 💛</footer>

<!-- 评分弹窗 -->
<div class="mask" id="rateMask">
  <div class="modal">
    <h3>给他的家乡文化点赞</h3>
    <div id="rateStu"></div>
    <div class="q" id="rateQ"></div>
    <div class="pick" id="pick">
      <span class="st" data-v="1">★</span><span class="st" data-v="2">★</span>
      <span class="st" data-v="3">★</span><span class="st" data-v="4">★</span>
      <span class="st" data-v="5">★</span>
    </div>
    <p class="plabel" id="plabel">点星星打分（1—5 星）</p>
    <textarea id="cmt" maxlength="60" placeholder="写一句鼓励的话吧（可以不写）"></textarea>
    <div class="mrow">
      <button class="btn btn-ghost" id="rcancel">再想想</button>
      <button class="btn btn-main" id="rok">提交点赞</button>
    </div>
    <div class="mmsg" id="rmsg"></div>
  </div>
</div>

<!-- 看大图（含这件作品的打分与评语） -->
<div class="mask viewer" id="viewMask">
  <div class="modal">
    <div class="big" id="big"></div>
    <div class="cap" id="bigCap"></div>
    <div class="who" id="bigWho"></div>
    <div class="vsec">
      <div class="vsec-t">💬 大家的评价<span id="bigTall"></span></div>
      <div class="vsum" id="bigRate"></div>
      <div class="dtlist" id="bigList"></div>
    </div>
    <div class="mrow"><button class="btn btn-ghost" id="vclose">关闭</button></div>
  </div>
</div>

<!-- 作品评价详情 -->
<div class="mask" id="detailMask">
  <div class="modal">
    <h3>💬 大家的评价</h3>
    <div class="q" id="dtCap"></div>
    <div id="dtWho" style="font-size:14px;color:#8A8078;margin-bottom:4px;"></div>
    <div class="dtlist" id="dtList"></div>
    <div class="mrow"><button class="btn btn-ghost" id="dtClose">关闭</button></div>
  </div>
</div>

<!-- 管理员登录 -->
<div class="mask" id="adminMask">
  <div class="modal">
    <h3>🔒 管理员登录</h3>
    <div class="q" style="font-size:15px;color:#8A8078;">请老师输入管理员密码，进入后可清除数据、查看数据面板。</div>
    <input type="password" class="pw" id="adminPw" placeholder="管理员密码" autocomplete="off">
    <div class="mmsg err" id="adminMsg"></div>
    <div class="mrow">
      <button class="btn btn-ghost" id="adminCancel">取消</button>
      <button class="btn btn-main" id="adminOk">进入</button>
    </div>
  </div>
</div>

<!-- 管理员菜单 -->
<div class="mask" id="adminMenu">
  <div class="modal">
    <h3>✅ 管理员模式</h3>
    <div class="q" style="font-size:15px;color:#8A8078;">老师你好，请选择要做什么：</div>
    <div class="mrow" style="flex-direction:column;gap:10px;">
      <button class="btn btn-main" id="mGoPanel" style="width:100%;">📊 进入数据面板</button>
      <button class="btn btn-ghost" id="mClear" style="width:100%;border-color:#F5C9C2;color:#C0392B;">🧹 一键清除作品数据</button>
      <button class="btn btn-ghost" id="mCloseMenu" style="width:100%;">返回作品墙</button>
    </div>
  </div>
</div>

<!-- 一键清除 -->
<div class="mask" id="clearMask">
  <div class="modal">
    <h3>⚠️ 一键清除</h3>
    <div class="q" style="font-size:15px;">清除后<strong>无法恢复</strong>，请老师确认。</div>
    <div class="warnbox">
      要清除哪些数据？
      <label><input type="checkbox" id="ckWorks" checked> 作品（同学做的二维码）</label>
      <label><input type="checkbox" id="ckRatings" checked> 评分（同学点的赞）</label>
      <label><input type="checkbox" id="ckSurveys"> 问卷（课前/课中/课后）</label>
    </div>
    <input type="password" class="pw" id="clearPw" placeholder="再输一次管理员密码" autocomplete="off">
    <div class="mmsg err" id="clearMsg"></div>
    <div class="mrow">
      <button class="btn btn-ghost" id="clearCancel">取消</button>
      <button class="btn btn-main" id="clearDo" style="background:#C0392B;box-shadow:0 3px 0 #93261B;">确认清除</button>
    </div>
  </div>
</div>

<script>/*__QRCODE_LIB__*/</script>
<script>/*__CLOUD_CONFIG__*/</script>
<script>/*__CLOUD_SDK__*/</script>
<script>
(function(){
'use strict';

var EMJ = { xieta:'🗼', shijinglin:'⛰️', taiping:'🏰', huapao:'🎆', qilin:'🦁', laoya:'🦆',
  caoxi:'🌾', minge:'🎵', houzi:'🐒', huashan:'🎨', detian:'💦', youyiguan:'🏯',
  jiulong:'🐉', zhuangshi:'🥁', longzhou:'🛶', shagao:'🍰', suancai:'🥬', wuse:'🍚', zhuangjin:'🧵', suanyu:'🐟' };

/* ---------- 二维码 ---------- */
if (qrcode.stringToBytesFuncs && qrcode.stringToBytesFuncs['UTF-8']){
  qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
}
function makeQR(text, size){
  size = size || 5;
  for (var t = 1; t <= 40; t++){
    try {
      var q = qrcode(t, 'M'); q.addData(text); q.make();
      var n = q.getModuleCount(), quiet = 4, px = n + quiet * 2;
      var cv = document.createElement('canvas');
      cv.width = cv.height = px * size;
      var ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = '#000';
      for (var r = 0; r < n; r++) for (var c = 0; c < n; c++)
        if (q.isDark(r, c)) ctx.fillRect((c+quiet)*size, (r+quiet)*size, size, size);
      return cv;
    } catch(e){}
  }
  return null;
}

/* ---------- 云服务 ---------- */
var cloud = null;
try {
  if (window.WorkBuddyCloud && window.CLOUD_CONFIG && window.CLOUD_CONFIG.endpoint){
    cloud = window.WorkBuddyCloud.createWorkBuddyCloud({
      endpoint: window.CLOUD_CONFIG.endpoint,
      oauthRelayBaseUrl: window.CLOUD_CONFIG.oauthRelayBaseUrl,
      publishableKey: window.CLOUD_CONFIG.publishableKey
    });
  }
} catch(e){ cloud = null; }

/* ---------- 全站通用身份（年级 / 班级 / 学号，与生成页一致） ---------- */
var LS_STU = 'cx_student';
var GRADES = ['三年级','四年级','五年级','六年级'];
var CLASSES = (function(){ var a=[]; for(var i=1;i<=12;i++) a.push(i+'班'); return a; })();
var NUMBERS = (function(){ var a=[]; for(var i=1;i<=50;i++) a.push(i+'号'); return a; })();
function stuGet(){ try { var v = localStorage.getItem(LS_STU); if(!v) return null; var o = JSON.parse(v); return (o && o.grade && o.klass && o.no) ? o : null; } catch(e){ return null; } }
function stuSet(o){ try { localStorage.setItem(LS_STU, JSON.stringify(o)); } catch(e){} }
function stuLabel(o){ return o ? (o.grade + o.klass + ' · ' + o.no) : ''; }
var WSTU = stuGet(), wEditing = !WSTU;
function fillSel(el, arr, cur, ph){
  el.innerHTML = '<option value="">' + ph + '</option>' + arr.map(function(v){
    return '<option value="' + v + '"' + (v === cur ? ' selected' : '') + '>' + v + '</option>';
  }).join('');
}
function renderRateStu(){
  var box = $('rateStu'); if (!box) return;
  if (WSTU && !wEditing){
    box.innerHTML = '<div class="stuShow">👦 <b>' + stuLabel(WSTU) + '</b>'
      + '<button type="button" class="stuedit" id="wStuEdit">改一改</button></div>';
    $('wStuEdit').onclick = function(){ wEditing = true; renderRateStu(); };
  } else {
    box.innerHTML = '<div class="sturow">'
      + '<select class="ssel" id="wSelGrade"></select>'
      + '<select class="ssel" id="wSelClass"></select>'
      + '<select class="ssel" id="wSelNo"></select></div>';
    fillSel($('wSelGrade'), GRADES, WSTU ? WSTU.grade : '四年级', '年级');
    fillSel($('wSelClass'), CLASSES, WSTU ? WSTU.klass : '', '班级');
    fillSel($('wSelNo'), NUMBERS, WSTU ? WSTU.no : '', '学号');
    ['wSelGrade','wSelClass','wSelNo'].forEach(function(id){
      $(id).onchange = function(){
        var g = $('wSelGrade').value, c = $('wSelClass').value, n = $('wSelNo').value;
        if (g && c && n){ WSTU = { grade:g, klass:c, no:n }; stuSet(WSTU); wEditing = false; renderRateStu(); }
      };
    });
  }
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function raterId(){
  if (WSTU) return 'stu-' + WSTU.grade + WSTU.klass + '-' + WSTU.no;
  var k = 'cx_rater_id', v = null;
  try { v = localStorage.getItem(k); } catch(e){}
  if (!v){
    v = 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    try { localStorage.setItem(k, v); } catch(e){}
  }
  return v;
}
function myRated(){
  try { return JSON.parse(localStorage.getItem('cx_rated') || '{}'); } catch(e){ return {}; }
}
function markRated(id){
  var m = myRated(); m[id] = 1;
  try { localStorage.setItem('cx_rated', JSON.stringify(m)); } catch(e){}
}

var WORKS = [], RATING_AGG = {}, RATING_BY = {};
var sortMode = 'new';   /* new = 最新发布（默认） / hot = 最受欢迎 / cmt = 评论最多 */
var $ = function(id){ return document.getElementById(id); };

/* ---------- 排序小工具 ---------- */
function tOf(w){
  var t = (w && w.created_at) ? new Date(w.created_at).getTime() : 0;
  return isNaN(t) ? 0 : t;
}
function byTimeDesc(a, b){ return tOf(b) - tOf(a); }          /* 上传时间从新到旧 */
function rateOf(w){ return RATING_AGG[w.id] || { sum:0, n:0 }; }

/* ---------- 加载 ---------- */
function load(){
  $('grid').innerHTML = '<div class="empty" style="grid-column:1/-1;">正在加载作品…</div>';
  if (!cloud){ render(); return; }
  Promise.all([
    cloud.database.from('works').select('*').order('created_at', { ascending:false }).limit(300),
    cloud.database.from('ratings').select('work_id, stars, comment, rater_id, rater_name, rater_klass, created_at')
      .order('created_at', { ascending:false }).limit(5000)
  ]).then(function(res){
    var w = res[0], r = res[1];
    if (w.error) throw w.error;
    WORKS = w.data || [];
    var agg = {}, byWork = {};
    (r.data || []).forEach(function(x){
      var o = agg[x.work_id] || (agg[x.work_id] = { sum:0, n:0 });
      o.sum += (parseInt(x.stars, 10) || 0); o.n += 1;
      (byWork[x.work_id] || (byWork[x.work_id] = [])).push(x);
    });
    RATING_AGG = agg; RATING_BY = byWork;
    render();
  }).catch(function(e){
    $('grid').innerHTML = '<div class="empty" style="grid-column:1/-1;">加载失败：'
      + esc(e && e.message ? e.message : '网络问题') + '<br>点右上角「刷新」再试一次</div>';
  });
}

/* ---------- 渲染 ---------- */
function render(){
  var grid = $('grid');
  var list = WORKS.slice();
  /* ---- 三种排序：主指标都是"多的在前"，打平时一律回落到上传时间从新到旧 ---- */
  if (sortMode === 'hot'){
    /* 最受欢迎：按点赞（收到评分的总条数）从多到少 */
    list.sort(function(a, b){
      var A = rateOf(a), B = rateOf(b);
      if (B.n !== A.n) return B.n - A.n;
      var av = A.n ? A.sum / A.n : 0, bv = B.n ? B.sum / B.n : 0;
      if (bv !== av) return bv - av;
      return byTimeDesc(a, b);
    });
  } else if (sortMode === 'cmt'){
    /* 评论最多：按写了评语的条数从多到少 */
    list.sort(function(a, b){
      var an = cmtsOf(a).length, bn = cmtsOf(b).length;
      if (bn !== an) return bn - an;
      var A = rateOf(a), B = rateOf(b);
      if (B.n !== A.n) return B.n - A.n;
      return byTimeDesc(a, b);
    });
  } else {
    /* 最新发布（默认）：按学生上传的时间节点从新到旧 */
    list.sort(byTimeDesc);
  }
  $('cnt').textContent = list.length;
  $('empty').style.display = list.length ? 'none' : '';
  grid.innerHTML = '';
  var rated = myRated();

  list.forEach(function(w){
    var agg = RATING_AGG[w.id] || { sum:0, n:0 };
    var avg = agg.n ? (agg.sum / agg.n).toFixed(1) : '—';
    var card = document.createElement('div');
    card.className = 'card';

    var qbox = document.createElement('div');
    qbox.className = 'qr';
    var cv = makeQR(w.content || '', 5);
    if (cv) qbox.appendChild(cv);
    qbox.title = '点一下看大图';

    var tp = document.createElement('span');
    tp.className = 'tp';
    tp.textContent = (EMJ[w.topic] || '🏵️') + ' ' + (w.topic_name || '家乡文化');

    var tx = document.createElement('div');
    tx.className = 'txt'; tx.textContent = w.content || '';

    var meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = '<span class="who">' + esc(w.author || '同学') + '</span>'
      + (w.klass ? '<span>· ' + esc(w.klass) + '</span>' : '');

    var act = document.createElement('div');
    act.className = 'act';
    var cmts = cmtsOf(w);
    var stEl = document.createElement('span');
    stEl.className = 'stars'; stEl.textContent = '★ ' + avg + (agg.n ? '（' + agg.n + '人赞）' : '（还没人赞）');
    var db = document.createElement('button');
    db.className = 'dtbtn';
    db.textContent = cmts.length ? '💬 ' + cmts.length + ' 条评语' : '💬 评价';
    db.onclick = function(){ openDetail(w); };
    var rb = document.createElement('button');
    rb.className = 'rate' + (rated[w.id] ? ' done' : '');
    rb.textContent = rated[w.id] ? '已赞过 ✓' : '👍 点赞';
    rb.disabled = !!rated[w.id];
    rb.onclick = function(){ openRate(w); };

    /* 最新一条评语：还没点进去就能看到别人说了什么 */
    var cmtEl = null;
    if (cmts.length){
      var c0 = cmts[0];
      var cw = (((c0.rater_klass || '') + ' ' + (c0.rater_name || '')).trim()) || '同学';
      cmtEl = document.createElement('div');
      cmtEl.className = 'cmt';
      cmtEl.innerHTML = esc(String(c0.comment).trim())
        + '<span class="by">—— ' + esc(cw) + (cmts.length > 1 ? ' 等 ' + cmts.length + ' 条评语' : '')
        + ' · 点看全部</span>';
      cmtEl.onclick = function(){ openDetail(w); };
    }

    act.appendChild(stEl); act.appendChild(db); act.appendChild(rb);
    card.appendChild(qbox); card.appendChild(tp); card.appendChild(tx);
    if (cmtEl) card.appendChild(cmtEl);
    card.appendChild(meta); card.appendChild(act);
    grid.appendChild(card);

    qbox.onclick = function(){ openView(w, avg, agg.n); };
  });
}

/* ---------- 看大图（顺便把打分与评语摆出来） ---------- */
function openView(w, avg, n){
  var big = $('big'); big.innerHTML = '';
  var cv = makeQR(w.content || '', 9);
  if (cv) big.appendChild(cv);
  $('bigCap').textContent = w.content || '';
  $('bigWho').textContent = (w.author || '同学') + (w.klass ? ' · ' + w.klass : '');
  var list = RATING_BY[w.id] || [];
  var nc = list.filter(function(r){ return r.comment && String(r.comment).trim(); }).length;
  $('bigTall').textContent = list.length
    ? '共 ' + list.length + ' 条打分' + (nc ? '、' + nc + ' 条评语' : '')
    : '';
  $('bigRate').innerHTML = '<span class="vavg">★ ' + avg + '</span>'
    + '<span>' + (n ? n + ' 位同学打了分' : '还没有人点赞，你可以做第一个') + '</span>';
  $('bigList').innerHTML = ratesHTML(w);
  $('viewMask').classList.add('on');
}
$('vclose').onclick = function(){ $('viewMask').classList.remove('on'); };

/* ---------- 作品评价详情 ---------- */
function fmtShort(t){
  if (!t) return '';
  var d = new Date(t); if (isNaN(d.getTime())) return '';
  return (d.getMonth() + 1) + '/' + d.getDate();
}
/* 一件作品的全部评价（打分 + 评语）：评价详情弹层 与 看大图 共用 */
function ratesHTML(w){
  var list = RATING_BY[w.id] || [];
  if (!list.length) return '<div class="dtempty">还没有人评价这件作品，快去点个赞吧～</div>';
  return list.map(function(r){
    var name = (r.rater_klass ? r.rater_klass + ' ' : '') + (r.rater_name || '');
    if (!name.trim()) name = '匿名同学';
    var s = parseInt(r.stars, 10) || 0;
    var stars = ''; for (var i = 0; i < s; i++) stars += '★';
    var hasC = r.comment && String(r.comment).trim();
    return '<div class="dtrow"><span class="dtwho">' + esc(name) + '</span>'
      + '<span class="dtst">' + stars + '</span>'
      + (hasC ? '<span class="dtcmt">' + esc(String(r.comment).trim()) + '</span>'
              : '<span class="dtcmt" style="color:#C0B6AB;">（只打了分，没有留言）</span>')
      + '<span class="dttime">' + fmtShort(r.created_at) + '</span></div>';
  }).join('');
}
function cmtsOf(w){
  return (RATING_BY[w.id] || []).filter(function(r){ return r.comment && String(r.comment).trim(); });
}
function openDetail(w){
  $('dtCap').textContent = w.content || '';
  $('dtWho').textContent = (w.author || '同学') + (w.klass ? ' · ' + w.klass : '');
  $('dtList').innerHTML = ratesHTML(w);
  $('detailMask').classList.add('on');
}
$('dtClose').onclick = function(){ $('detailMask').classList.remove('on'); };

/* ---------- 评分 ---------- */
var cur = { work:null, stars:0 };
document.querySelectorAll('#pick .st').forEach(function(el){
  el.onclick = function(){
    cur.stars = parseInt(el.getAttribute('data-v'), 10);
    document.querySelectorAll('#pick .st').forEach(function(x){
      x.classList.toggle('on', parseInt(x.getAttribute('data-v'),10) <= cur.stars);
    });
    $('plabel').textContent = ['','一星','二星','三星','四星','五星'][cur.stars] + ' · '
      + ['','继续加油','还不错','挺好的','很棒','太棒了'][cur.stars];
  };
});
function openRate(w){
  cur.work = w; cur.stars = 0; $('cmt').value = '';
  $('rateQ').textContent = w.content || '';
  document.querySelectorAll('#pick .st').forEach(function(x){ x.classList.remove('on'); });
  $('plabel').textContent = '点星星打分（1—5 星）';
  $('rmsg').textContent = ''; $('rmsg').className = 'mmsg';
  renderRateStu();
  $('rateMask').classList.add('on');
}
$('rcancel').onclick = function(){ $('rateMask').classList.remove('on'); };

$('rok').onclick = async function(){
  if (!cur.stars){ $('rmsg').className = 'mmsg err'; $('rmsg').textContent = '先点一下星星吧～'; return; }
  if (!WSTU){ $('rmsg').className = 'mmsg err'; $('rmsg').textContent = '先在上面选一下你是谁哦～'; return; }
  if (!cloud){ $('rmsg').className = 'mmsg err'; $('rmsg').textContent = '连不上服务，稍后再试。'; return; }
  var btn = $('rok'); btn.disabled = true;
  $('rmsg').className = 'mmsg'; $('rmsg').textContent = '正在提交…';
  try {
    var res = await cloud.database.from('ratings').insert({
      work_id: cur.work.id, rater_id: raterId(), stars: cur.stars,
      rater_name: WSTU.no, rater_klass: WSTU.grade + WSTU.klass,
      comment: ($('cmt').value || '').slice(0, 60)
    }).select();
    if (res.error) throw res.error;
    if (!res.data || !res.data.length) throw new Error('未写入');
    markRated(cur.work.id);
    var agg = RATING_AGG[cur.work.id] || (RATING_AGG[cur.work.id] = { sum:0, n:0 });
    agg.sum += cur.stars; agg.n += 1;
    (RATING_BY[cur.work.id] || (RATING_BY[cur.work.id] = [])).unshift({
      work_id: cur.work.id, stars: cur.stars, comment: ($('cmt').value || '').slice(0, 60),
      rater_name: WSTU.no, rater_klass: WSTU.grade + WSTU.klass, created_at: new Date().toISOString()
    });
    $('rmsg').className = 'mmsg ok'; $('rmsg').textContent = '点赞成功，谢谢你！';
    render();
    setTimeout(function(){ $('rateMask').classList.remove('on'); }, 650);
  } catch(e){
    $('rmsg').className = 'mmsg err';
    $('rmsg').textContent = '提交失败：' + (e && e.message ? e.message : '网络问题');
  } finally { btn.disabled = false; }
};

/* ---------- 排序 / 刷新 ---------- */
document.querySelectorAll('.seg button').forEach(function(b){
  b.onclick = function(){
    document.querySelectorAll('.seg button').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    sortMode = b.getAttribute('data-sort');
    render();
  };
});
$('refresh').onclick = load;
document.querySelectorAll('.mask').forEach(function(m){
  m.onclick = function(e){ if (e.target === m) m.classList.remove('on'); };
});

  } finally { btn.disabled = false; }
};
